[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotelkin-planfix-mcp"
version = "0.1.2"
description = "MCP server for Planfix REST API over STDIO"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "AndreiSVetvit" },
]
keywords = ["mcp", "model-context-protocol", "planfix", "planfix-api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp[cli]>=1.12.0,<2",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Repository = "https://github.com/AndreiSVetvit/kotelkin-planfix-mcp"
Issues = "https://github.com/AndreiSVetvit/kotelkin-planfix-mcp/issues"

[project.scripts]
planfix-mcp-server = "planfix_mcp.server:main"
planfix-mcp-preflight = "scripts.preflight:main"
planfix-mcp-smoke = "scripts.smoke_tools:main"
planfix-mcp-swagger-check = "scripts.check_swagger_alignment:main"
planfix-mcp-secrets-init = "scripts.secrets_init:main"
planfix-mcp-live-qa-basic = "scripts.live_qa_basic:main"
planfix-mcp-live-qa-extended = "scripts.live_qa_extended:main"

[tool.setuptools]
packages = ["planfix_mcp", "planfix_mcp.tools", "planfix_mcp.schemas", "scripts"]
