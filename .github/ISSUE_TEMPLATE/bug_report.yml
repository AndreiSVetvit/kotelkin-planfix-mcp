name: Bug report
description: Report a reproducible problem with the Planfix MCP server.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste Planfix tokens or screenshots containing tokens.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version, tag, or commit hash.
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact commands or MCP tool calls, with tokens removed.
      placeholder: |
        1. Run ...
        2. Call tool ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove tokens, private account data, and sensitive task content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed tokens and private data from this issue.
          required: true
        - label: I tested with the latest default branch or release.
          required: false
