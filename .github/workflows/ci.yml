name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall planfix_mcp scripts

      - name: Smoke tools
        run: python scripts/smoke_tools.py

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
